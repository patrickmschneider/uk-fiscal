name: Retrieve OBR source
on: workflow_dispatch
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Download public databank
        run: |
          mkdir source
          curl --fail --location --max-time 45 'https://obr.uk/download/public-finances-databank/' --output source/databank.xlsx
      - uses: actions/upload-artifact@v4
        with:
          name: obr-databank
          path: source/
          retention-days: 1
